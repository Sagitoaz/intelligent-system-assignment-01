<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo tiểu luận · Chương 2–7</title>
<style>
:root{--ink:#14203d;--line:#cfe0fa;--blue:#2589e0;--green:#22b05a;--amber:#e8a317;--mute:#5a6b8c;--sw:310px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-weight:600;color:var(--ink);background:#f7fbff;display:flex;overflow:hidden}
#side{width:var(--sw);flex:none;display:flex;flex-direction:column;background:#fff;border-right:3px solid var(--line);transition:width .2s;min-height:0;z-index:20}
body.collapsed #side{width:64px}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid #e3edfb}
.top h1{font-size:15px;margin:0;line-height:1.25;flex:1}
.top h1 small{display:block;font-size:11.5px;color:var(--mute);font-weight:600}
.cbtn{border:2px solid #bfd0ee;background:#fff;border-radius:10px;width:34px;height:34px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink);flex:none}
.cbtn:hover{background:#eef5ff}
body.collapsed .top h1{display:none}
body.collapsed .top{justify-content:center;padding:10px 0}
#list{flex:1;overflow-y:auto;padding:8px}
.item{border:2px solid transparent;border-radius:13px;margin-bottom:6px;background:#fff}
.item.active{border-color:var(--c);background:#fbfdff}
.hd{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer;padding:8px 8px;color:var(--ink);border-radius:11px}
.hd:hover{background:#eef5ff}
.num{position:relative;flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.num i{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#c4cfe3;border:2px solid #fff}
.num i.up{background:var(--green)} .num i.down{background:var(--amber)}
.nm{flex:1;min-width:0;line-height:1.25}
.nm b{display:block;font-size:14.5px}
.nm span{font-size:12px;color:var(--mute);font-weight:600}
body.collapsed .nm,body.collapsed .item.active .more,body.collapsed .more{display:none}
body.collapsed .hd{justify-content:center;padding:6px 0}
body.collapsed .item{border-color:transparent}
body.collapsed .item.active .num{outline:3px solid var(--c);outline-offset:2px}
.more{display:none;padding:2px 12px 12px 12px;font-size:13px;line-height:1.5;font-weight:600}
.item.active .more{display:block}
.more h4{margin:8px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.more p{margin:0}
.more ol{margin:0;padding-left:18px}
.more li{margin:2px 0}
.lk{margin-top:8px;border:2px solid var(--c);background:#fff;color:var(--ink);border-radius:9px;padding:4px 10px;font:inherit;font-weight:800;font-size:12.5px;cursor:pointer}
.lk:hover{background:#eef5ff}
.note{padding:8px 12px;font-size:11.5px;color:#7a5b00;background:#fff7e0;border-top:2px solid #f3d98a;line-height:1.4}
body.collapsed .note{display:none}
#st{padding:4px 12px;font-size:11.5px;color:var(--mute);border-top:1px solid #e3edfb}
body.collapsed #st{display:none}
#main{flex:1;min-width:0;position:relative;display:flex}
#view{flex:1;min-width:0;position:relative;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pane{position:absolute;inset:0}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#f7fbff;color:#4a5b7f;z-index:2;text-align:center;padding:20px}
.spin{width:36px;height:36px;border:5px solid #d7e5fa;border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#ref{width:340px;flex:none;overflow-y:auto;padding:12px;background:#f7fbff;border-left:3px solid var(--line)}
body.noref #ref{display:none}
#ref h2{font-size:15px;margin:0 0 8px;color:var(--c)}
#ref .card{background:#fff;border:2px solid #dbe6f8;border-radius:13px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;line-height:1.45}
#ref .card b.h{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
#ref ul{margin:2px 0 0;padding-left:18px}
#ref li{margin:2px 0}
#ref code{font-size:11.5px;word-break:break-all;background:#f2f4f8;padding:1px 4px;border-radius:4px}
.fab{position:absolute;z-index:15;border:2.5px solid #bfd0ee;background:#fff;border-radius:12px;padding:6px 12px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:0 2px 8px rgba(20,32,61,.15)}
.fab:hover{background:#eef5ff}
#refbtn{right:12px;bottom:12px}
body:not(.noref) #refbtn{display:none}
#menubtn{display:none;left:10px;top:10px}
#scrim{display:none}
.close{float:right;border:2px solid #bfd0ee;background:#fff;border-radius:8px;width:28px;height:28px;font:inherit;font-weight:900;cursor:pointer}
@media(max-width:800px){
  #side{position:fixed;left:0;top:0;bottom:0;width:min(310px,86vw)!important;transform:translateX(-102%);transition:transform .2s}
  body.drawer #side{transform:none}
  body.drawer #scrim{display:block;position:fixed;inset:0;background:rgba(20,32,61,.35);z-index:19}
  body.collapsed .nm{display:block}
  body.collapsed .item.active .more{display:block}
  body.collapsed .top h1{display:block}
  #menubtn{display:block}
  #ref{position:absolute;right:0;top:0;bottom:0;width:min(340px,92vw);z-index:16;box-shadow:-4px 0 14px rgba(20,32,61,.2)}
  #cbtn{display:none}
}
</style>
</head>
