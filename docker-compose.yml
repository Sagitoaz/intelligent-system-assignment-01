services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-assignment-local-change-me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-assignment-local-change-me} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-assignment-local-change-me}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/workspace/models:ro
      - ./knowledge_graph:/workspace/knowledge_graph:ro
    depends_on:
      neo4j:
        condition: service_started

  neo4j-seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.knowledge_graph.seed"]
    environment:
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-assignment-local-change-me}
    volumes:
      - ./models:/workspace/models:ro
      - ./knowledge_graph:/workspace/knowledge_graph:ro
    depends_on:
      neo4j:
        condition: service_healthy
    profiles: ["tools"]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
